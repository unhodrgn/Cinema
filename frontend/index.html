<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Cinema Reservation</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Generated by the frontend server from API_BASE_URL; defines window.APP_CONFIG. -->
  <script src="/config.js"></script>
  <script type="module" src="/js/pages/index.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Cinema Reservation</a>
    <nav id="site-nav" class="site-nav" aria-label="Main"></nav>
  </header>

  <main class="container">
    <h1 class="visually-hidden">Cinema Reservation System</h1>
    <div id="status-message" aria-live="polite"></div>

    <section id="hero" class="hero" aria-label="Featured movie" hidden></section>

    <div id="home-sections" hidden>
      <section aria-labelledby="now-showing-title">
        <div class="section-head">
          <h2 id="now-showing-title">Now Showing</h2>
          <a href="/movies.html">All movies</a>
        </div>
        <div id="now-showing" class="poster-grid"></div>
      </section>

      <section aria-labelledby="today-title">
        <div class="section-head">
          <h2 id="today-title">Today by hall <span id="today-date" class="muted"></span></h2>
          <a href="/screenings.html">Full schedule</a>
        </div>
        <div id="today-by-hall" class="hall-grid"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">Movie posters: TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
</body>
</html>
