<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1050" viewBox="0 0 1380 1050" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif"><title>개념적 데이터 모델</title><rect width="1380" height="1050" fill="#f0f5f8" /><text x="45" y="57" fill="#152b3a" font-size="31" font-weight="bold">개념적 데이터 모델</text><text x="45" y="88" fill="#31586e" font-size="17" font-weight="normal">영화관 예매 시스템  ·  1 = 필수 한 건   /   0..N = 선택적 복수 참여   /   1..N = 한 건 이상</text><polyline points="441,169 620,169 620,420" fill="none" stroke="#52768c" stroke-width="2" /><text x="446" y="162" fill="#31586e" font-size="13" font-weight="bold">1</text><text x="628" y="412" fill="#31586e" font-size="13" font-weight="bold">0..N</text><polyline points="243,498 243,805" fill="none" stroke="#52768c" stroke-width="2" /><text x="251" y="516" fill="#31586e" font-size="13" font-weight="bold">1</text><text x="251" y="797" fill="#31586e" font-size="13" font-weight="bold">1..N</text><polyline points="441,459 495,459" fill="none" stroke="#52768c" stroke-width="2" /><text x="446" y="452" fill="#31586e" font-size="13" font-weight="bold">1</text><text x="460" y="452" fill="#31586e" font-size="13" font-weight="bold">0..N</text><polyline points="1143,208 1143,420" fill="none" stroke="#52768c" stroke-width="2" /><text x="1151" y="226" fill="#31586e" font-size="13" font-weight="bold">1</text><text x="1151" y="412" fill="#31586e" font-size="13" font-weight="bold">0..N</text><polyline points="891,459 945,459" fill="none" stroke="#52768c" stroke-width="2" /><text x="896" y="452" fill="#31586e" font-size="13" font-weight="bold">1</text><text x="910" y="452" fill="#31586e" font-size="13" font-weight="bold">0..N</text><polyline points="1143,520 1143,805" fill="none" stroke="#52768c" stroke-width="2" /><text x="1151" y="538" fill="#31586e" font-size="13" font-weight="bold">1</text><text x="1151" y="797" fill="#31586e" font-size="13" font-weight="bold">0..N</text><polyline points="441,844 945,844" fill="none" stroke="#52768c" stroke-width="2" /><text x="446" y="837" fill="#31586e" font-size="13" font-weight="bold">1</text><text x="910" y="837" fill="#31586e" font-size="13" font-weight="bold">0..N</text><rect x="45" y="130" width="396" height="78" rx="9" fill="#ffffff" stroke="#c9d9e3" /><rect x="45" y="130" width="396" height="39" rx="7" fill="#174866" /><text x="60" y="156" fill="white" font-size="19" font-weight="bold">영화</text><text x="60" y="191" fill="#152b3a" font-size="15" font-weight="normal">영화 정보 6개 속성</text><rect x="45" y="420" width="396" height="78" rx="9" fill="#ffffff" stroke="#c9d9e3" /><rect x="45" y="420" width="396" height="39" rx="7" fill="#174866" /><text x="60" y="446" fill="white" font-size="19" font-weight="bold">상영관</text><text x="60" y="481" fill="#152b3a" font-size="15" font-weight="normal">상영 공간 · 업무 구성 50석</text><rect x="45" y="805" width="396" height="78" rx="9" fill="#ffffff" stroke="#c9d9e3" /><rect x="45" y="805" width="396" height="39" rx="7" fill="#174866" /><text x="60" y="831" fill="white" font-size="19" font-weight="bold">좌석</text><text x="60" y="866" fill="#152b3a" font-size="15" font-weight="normal">행과 번호로 구분하는 물리 좌석</text><rect x="495" y="420" width="396" height="100" rx="9" fill="#ffffff" stroke="#c9d9e3" /><rect x="495" y="420" width="396" height="39" rx="7" fill="#174866" /><text x="510" y="446" fill="white" font-size="19" font-weight="bold">상영 일정</text><text x="510" y="481" fill="#152b3a" font-size="15" font-weight="normal">영화·상영관·상영 시간</text><text x="510" y="503" fill="#152b3a" font-size="15" font-weight="normal">회차별 좌석 단가</text><rect x="945" y="130" width="396" height="78" rx="9" fill="#ffffff" stroke="#c9d9e3" /><rect x="945" y="130" width="396" height="39" rx="7" fill="#174866" /><text x="960" y="156" fill="white" font-size="19" font-weight="bold">사용자 계정</text><text x="960" y="191" fill="#152b3a" font-size="15" font-weight="normal">고객 또는 관리자 계정</text><rect x="945" y="420" width="396" height="100" rx="9" fill="#ffffff" stroke="#c9d9e3" /><rect x="945" y="420" width="396" height="39" rx="7" fill="#174866" /><text x="960" y="446" fill="white" font-size="19" font-weight="bold">예매</text><text x="960" y="481" fill="#152b3a" font-size="15" font-weight="normal">고객이 확정한 예매와 이력</text><text x="960" y="503" fill="#152b3a" font-size="15" font-weight="normal">상태·결제 기한·총액</text><rect x="945" y="805" width="396" height="100" rx="9" fill="#ffffff" stroke="#c9d9e3" /><rect x="945" y="805" width="396" height="39" rx="7" fill="#174866" /><text x="960" y="831" fill="white" font-size="19" font-weight="bold">예매 좌석</text><text x="960" y="866" fill="#152b3a" font-size="15" font-weight="normal">예매에 배정된 개별 좌석</text><text x="960" y="888" fill="#152b3a" font-size="15" font-weight="normal">확정 단가 스냅샷</text><text x="45" y="1020" fill="#31586e" font-size="15" font-weight="normal">확정 예매: 좌석 상세 1건 이상  ·  취소·만료: 상세 0건, 예매 이력 보존</text></svg>